name: Build CI

on:
  push:
  pull_request:

jobs:
  workspace:
    name: Workspace ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, rustfmt, clippy

      - name: Check format
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo build

  bare-metal:
    name: Bare-metal ${{ matrix.arch }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, riscv64]
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview, clippy

      - name: Cache musl-cross toolchain (macOS)
        if: runner.os == 'macOS'
        id: cache-musl
        uses: actions/cache@v4
        with:
          path: /opt/homebrew/Cellar/musl-cross
          key: musl-cross-${{ runner.os }}-${{ runner.arch }}-v0.9.11

      - name: Install cross-compilation toolchain (macOS)
        if: runner.os == 'macOS' && steps.cache-musl.outputs.cache-hit != 'true'
        run: make config

      - name: Restore musl-cross symlinks (macOS)
        if: runner.os == 'macOS' && steps.cache-musl.outputs.cache-hit == 'true'
        run: brew link musl-cross 2>/dev/null || brew tap FiloSottile/musl-cross && brew link filosottile/musl-cross/musl-cross 2>/dev/null || true

      - name: Install kernel headers (macOS, cached)
        if: runner.os == 'macOS' && steps.cache-musl.outputs.cache-hit == 'true'
        run: |
          MUSL_PREFIX=$(brew --prefix musl-cross)/libexec
          for MUSL_ARCH in aarch64 riscv64; do
            SYSROOT="$MUSL_PREFIX/$MUSL_ARCH-linux-musl"
            if [ ! -f "$SYSROOT/include/linux/compiler.h" ]; then
              make config
              break
            fi
          done

      - name: Install cross-compilation toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y qemu-utils wget

      - name: Build ${{ matrix.arch }} bare-metal linux
        run: cargo bin -m virt-${{ matrix.arch }}

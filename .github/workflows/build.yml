name: Build CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  rust_toolchain: nightly-2026-09-01

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.rust_toolchain }}
          components: rust-src, rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ env.rust_toolchain }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ env.rust_toolchain }}-

      - name: Check format
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo build --all-features

      - name: Clippy
        run: cargo clippy --all-features

      - name: Pull prebuilt images
        if: github.event_name == 'workflow_dispatch'
        run: make zircon-init

      - name: Build docs
        if: github.event_name == 'workflow_dispatch'
        run: cargo doc --no-deps --all-features --workspace

  test-libos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        mode: [linux, zircon]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.rust_toolchain }}
          components: rust-src, llvm-tools-preview, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ matrix.mode }}-${{ env.rust_toolchain }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ matrix.mode }}-${{ env.rust_toolchain }}-

      - name: Pull prebuilt images
        if: matrix.mode == 'zircon'
        run: make zircon-init

      - name: Build
        run: cargo build --package zcore --features "${{ matrix.mode }} libos"

      - name: Clippy
        run: cargo clippy --package zcore --features "${{ matrix.mode }} libos"

  test-bare-metal:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, riscv64, aarch64]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: 'recursive'

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.rust_toolchain }}
          components: rust-src, llvm-tools-preview, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ matrix.arch }}-${{ env.rust_toolchain }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ matrix.arch }}-${{ env.rust_toolchain }}-

      - name: Install cargo-binutils
        run: cargo install cargo-binutils --locked

      - name: Install qemu-utils
        run: sudo apt update && sudo apt install qemu-utils

      - name: Pull prebuilt images
        if: matrix.arch == 'x86_64'
        run: make zircon-init

      - name: Build ${{ matrix.arch }} bare-metal zircon
        if: matrix.arch == 'x86_64'
        run: cd zCore && make build  ARCH=${{ matrix.arch }} ZBI=core-tests

      - name: Clippy ${{ matrix.arch }} bare-metal zircon
        if: matrix.arch == 'x86_64'
        run: cd zCore && make clippy ARCH=${{ matrix.arch }} ZBI=core-tests

      - name: Build ${{ matrix.arch }} bare-metal linux
        if: matrix.arch != 'x86_64'
        run: cd zCore && make build  ARCH=${{ matrix.arch }} LINUX=1

      - name: Clippy ${{ matrix.arch }} bare-metal linux
        run: cd zCore && make clippy ARCH=${{ matrix.arch }} LINUX=1

      - name: Xtask Build bare-metal linux
        run: cargo bin -m virt-${{ matrix.arch }}

  build-user:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install prebuilt images
        run: make zircon-init

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.rust_toolchain }}
          targets: x86_64-unknown-fuchsia

      - name: Build Zircon user programs
        run: cd zircon-user && make build MODE=release

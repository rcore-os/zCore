name: Test CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  rust_toolchain: nightly-2026-09-01

jobs:
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.rust_toolchain }}
          components: rust-src, llvm-tools-preview

      - name: Run unit test
        run: cargo test --no-fail-fast

  zircon-core-test-libos:
    name: Zircon Core Test Libos (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64 Linux
            os: ubuntu-latest
            arch: x86_64
            uname: x86_64
          - name: aarch64 Linux
            os: ubuntu-24.04-arm
            arch: aarch64
            uname: aarch64
          - name: aarch64 macOS
            os: macos-15
            arch: aarch64
            uname: arm64
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: 'recursive'

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.rust_toolchain }}
          components: rust-src, llvm-tools-preview

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Verify native architecture
        run: test "$(uname -m)" = "${{ matrix.uname }}"

      - name: Install wget on macOS
        if: runner.os == 'macOS'
        run: brew install wget

      - name: Pull prebuilt images
        run: make zircon-init

      - name: Install python dependencies
        run: python3 -m pip install -r tests/requirements.txt

      - name: Run fast tests
        if: github.event_name != 'workflow_dispatch'
        run: cd tests && python3 zircon_core_test.py --arch ${{ matrix.arch }} --libos --fast

      - name: Run full tests
        if: github.event_name == 'workflow_dispatch'
        run: cd tests && python3 zircon_core_test.py --arch ${{ matrix.arch }} --libos

  zircon-core-test:
    name: Zircon Core Test Baremetal (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            qemu_package: qemu-system-x86
            qemu_binary: qemu-system-x86_64
          - arch: aarch64
            qemu_package: qemu-system-arm
            qemu_binary: qemu-system-aarch64
          - arch: riscv64
            qemu_package: qemu-system-misc
            qemu_binary: qemu-system-riscv64
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: 'recursive'

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.rust_toolchain }}
          components: rust-src, llvm-tools-preview

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Pull prebuilt images
        run: make zircon-init

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.qemu_package }}
          ${{ matrix.qemu_binary }} --version

      - name: Install cargo-binutils
        if: matrix.arch == 'riscv64'
        run: cargo install cargo-binutils --locked

      - name: Install python dependencies
        run: python3 -m pip install -r tests/requirements.txt

      - name: Run fast tests
        if: github.event_name != 'workflow_dispatch'
        run: cd tests && python3 zircon_core_test.py --arch ${{ matrix.arch }} --fast

      - name: Run full tests
        if: github.event_name == 'workflow_dispatch'
        run: cd tests && python3 zircon_core_test.py --arch ${{ matrix.arch }}

  linux-libc-test-libos:
    name: Linux Libc Test Libos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: 'recursive'

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.rust_toolchain }}
          components: rust-src, llvm-tools-preview

      - name: Prepare rootfs
        run: cargo xtask libos-libc-test

      - name: Install python dependencies
        run: pip3 install -r tests/requirements.txt

      - name: Run fast tests
        if: github.event_name != 'workflow_dispatch'
        run: cd tests && python3 linux_libc_test.py --libos --fast

      - name: Run full tests
        if: github.event_name == 'workflow_dispatch'
        run: cd tests && python3 linux_libc_test.py --libos

  linux-libc-test-baremetal:
    name: Linux Libc Test Baremetal
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, riscv64, aarch64]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: 'recursive'

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.rust_toolchain }}
          components: rust-src, llvm-tools-preview

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system
          qemu-system-${{ matrix.arch }} --version

      - name: Prepare rootfs
        run: cargo libc-test --arch ${{ matrix.arch }} && cargo image --arch ${{ matrix.arch }}

      - name: Install cargo-binutils
        if: matrix.arch == 'riscv64'
        run: cargo install cargo-binutils --locked

      - name: Install python dependencies
        run: pip3 install -r tests/requirements.txt

      - name: Run fast tests
        if: github.event_name != 'workflow_dispatch'
        run: cd tests && python3 linux_libc_test-qemu.py --arch ${{ matrix.arch }} --fast

      - name: Run full tests
        if: github.event_name == 'workflow_dispatch'
        run: cd tests && python3 linux_libc_test-qemu.py --arch ${{ matrix.arch }}

  linux-other-test-baremetal:
    name: Linux Other Test Baremetal
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, riscv64, aarch64]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: 'recursive'

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.rust_toolchain }}
          components: rust-src, llvm-tools-preview

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system
          qemu-system-${{ matrix.arch }} --version

      - name: Prepare rootfs
        run: cargo other-test --arch ${{ matrix.arch }} && cargo image --arch ${{ matrix.arch }}

      - name: Install cargo-binutils
        if: matrix.arch == 'riscv64'
        run: cargo install cargo-binutils --locked

      - name: Install python dependencies
        run: pip3 install -r tests/requirements.txt

      - name: Run fast tests
        if: github.event_name != 'workflow_dispatch'
        run: cd tests && python3 linux_other_test.py --arch ${{ matrix.arch }} --fast

      - name: Run full tests
        if: github.event_name == 'workflow_dispatch'
        run: cd tests && python3 linux_other_test.py --arch ${{ matrix.arch }}

[package]
name = "wavplay"
version = "0.1.0"
edition = "2021"
description = "Minimal OSS (/dev/dsp) WAV player and test-tone generator for Eclipse OS"

# Standalone tool: NOT a workspace member. It targets userspace
# (x86_64-unknown-linux-musl), not the zCore bare-metal target, so it is built
# on its own by `xtask` (see `LinuxRootfs::wavplay`), exactly like lunarbar.
[workspace]

[[bin]]
name = "wavplay"
path = "src/main.rs"

[dependencies]
libc = "0.2"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
panic = "abort"
strip = true

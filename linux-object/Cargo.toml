[package]
name = "linux-object"
version = "0.1.0"
authors = ["Runji Wang <wangrunji0408@163.com>"]
edition = "2018"
description = "Linux kernel objects"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
mock-disk = []

[dependencies]
async-trait = "0.1"
log = "0.4"
xmas-elf = "0.7"
bitflags = "1.3"
hashbrown = "0.9"
numeric-enum-macro = "0.2"
delegate = "0.13"
zircon-object = { path = "../zircon-object", features = ["elf"] }
kernel-hal = { path = "../kernel-hal", default-features = false }
linux-vdso = { path = "../linux-vdso" }
downcast-rs = { version = "1.2", default-features = false }
lazy_static = { version = "1.4", features = ["spin_no_std"] }
hunter = { path = "../hunter" }
rcore-fs = { git = "https://github.com/rcore-os/rcore-fs", rev = "1a3246b" }
rcore-fs-sfs = { git = "https://github.com/rcore-os/rcore-fs", rev = "1a3246b" }
rcore-fs-ramfs = { git = "https://github.com/rcore-os/rcore-fs", rev = "1a3246b" }
rcore-fs-mountfs = { git = "https://github.com/rcore-os/rcore-fs", rev = "1a3246b" }
btrfs = { path = "../vendor/btrfs-rs" }
fatfs = { git = "https://github.com/rafalh/rust-fatfs", default-features = false, features = ["alloc", "lfn", "log_level_warn"] }
spin = "0.9"
rcore-fs-devfs = { git = "https://github.com/rcore-os/rcore-fs", rev = "1a3246b" }
cfg-if = "1.0"
zcore-drivers = { path = "../drivers", features = ["virtio"] }
pci = { git = "https://github.com/elliott10/pci-rs", rev = "8f33774b" }
lock = { git = "https://github.com/DeathWish5/kernel-sync", rev = "8486b8" }
smoltcp = { git = "https://github.com/smoltcp-rs/smoltcp", rev = "35e833e3", default-features = false, features = [
    "log",
    "alloc",
    "verbose",
    "proto-ipv4",
    "proto-ipv6",
    "proto-igmp",
    "medium-ip",
    "medium-ethernet",
    "socket-raw",
    "socket-udp",
    "socket-tcp",
    "socket-icmp",
    "async",
] }

[dev-dependencies]
async-std = { version = "1.10", features = ["attributes"] }
kernel-hal = { path = "../kernel-hal", features = ["libos"] }
zcore-drivers = { path = "../drivers", features = ["mock"] }
